<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send mail</title>
    <script type="text/javascript" src=""></script>
    <style>
       
        :root[data-theme="light"] {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --input-border: #cccccc;
            --btn-bg: #4a90e2;
            --btn-text: #ffffff;
        }

        :root[data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --input-border: #444444;
            --btn-bg: #bb86fc;
            --btn-text: #121212;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .control {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .theme-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            font-weight: bold;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 450px;
            overflow: hidden;
         
        }
        .banner-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        form {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 {
            margin: 0 0 10px 0;
            text-align: center;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--input-border);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        input:focus, textarea:focus {
            outline: 2px solid var(--btn-bg);
        }

        .submit-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }


 .card{
    border:3px solid transparent;
    border-radius:12px;
    animation:borderColor 5s linear infinite;
} 

@keyframes borderColor{
    0%{border-color:red;}
    20%{border-color:orange;}
    40%{border-color:yellow;}
    60%{border-color:lime;}
    80%{border-color:cyan;}
    100%{border-color:violet;}
}
    </style>
</head>
<body>

    <div class="control">
        <button class="theme-btn" id="themeToggle">Light Mode</button>
    </div>

    <div class="card">
        <img class="banner-img" src="banner-image.jpg">
        
        <form id="emailForm">
            <h2>Send a Message</h2>
            
            <div>
                <label for="to_email">Gmail:</label>
                <input type="email" id="to_email" placeholder="public@gmail.com" required>
            </div>

            <div>
                <label for="subject">Subject:</label>
                <input type="text" id="subject" placeholder="Hello!" required>
            </div>

            <div>
                <label for="message">Message:</label>
                <textarea id="message" placeholder="Type your message here..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Email</button>
        </form>
    </div>

    <script>
       
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                htmlElement.setAttribute('data-theme', 'light');
                themeToggle.textContent = 'Dark Mode';
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = 'Light Mode';
            }
        });

        
        emailjs.init("9dVL4bkNRMx2Ow7f0");

        document.getElementById('emailForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const submitBtn = event.target.querySelector('.submit-btn');
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;

            const templateParams = {
                to_email: document.getElementById('to_email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

        
            emailjs.send('service_jlsryq4', 'template_zrk3hpz', templateParams)
                .then(function() {
                    alert('Message sent successfully!');
                    document.getElementById('emailForm').reset();
                }, function(error) {
                    alert('Failed to send message: ' + JSON.stringify(error));
                })
                .finally(() => {
                    submitBtn.textContent = 'Send Email';
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
