      //work on localStorage(save values more permanently)

      //property and method
      console.log('hello'.length); //this is property
      console.log('hello'.toUpperCase());//this is method

      const object1 = {
        message: 'hello'
      };
      const object2 = object1;//copy reference

      object1.message = 'GOOD JOB';
      console.log(object1);
      console.log(object2);

      const object3 = {
        message: 'GOOD JOB'
      };
      console.log(object3===object1);//this code is compare the reference not the value
      console.log(object2===object1);


      const object4 = {
        message: 'GOOD JOB',
        price: 799
      };
      //const message = object4.message
      const { message,price} = object4;//destructing-easier way to take property out of an object
      console.log(message);
      console.log(price);
      

      //shorthand method
      const object5 = {
        //message: message
        message,
        method: function function1() {
          console.log('method');
        }
